<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Crush</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 45%, #ffecd2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  h1 {
    margin: 14px 0 6px;
    font-size: 40px;
    color: #b51717;
    text-shadow: 2px 2px 0 #ff9e1a, 4px 4px 0 rgba(0,0,0,.12);
    letter-spacing: 2px;
    text-align: center;
  }
  .subtitle { color: #6b21a8; margin-bottom: 10px; font-weight: 800; text-align: center; font-size: 15px; }
  #hud {
    display: flex;
    gap: 26px;
    margin-bottom: 12px;
    font-size: 20px;
    font-weight: 800;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat {
    background: rgba(255,255,255,0.88);
    padding: 7px 16px;
    border-radius: 13px;
    border: 3px solid #e2574c;
    box-shadow: 0 4px 0 #c24138;
    color: #831a1a;
    min-width: 100px;
    text-align: center;
  }
  .stat span { display: block; font-size: 13px; opacity: .8; text-transform: uppercase; letter-spacing: 1px; }
  .stat b { font-size: 24px; display: block; }
  #board-wrap {
    position: relative;
    padding: 12px;
    background: rgba(20, 20, 45, 0.5);
    border: 8px solid #5e60ce;
    border-radius: 18px;
    box-shadow: 0 14px 45px rgba(0,0,0,.4), inset 0 0 25px rgba(255,255,255,.5);
  }
  canvas {
    display: block;
    background: #fff;
    border-radius: 12px;
    cursor: pointer;
  }
  #msg {
    margin: 10px 0 6px;
    font-size: 20px;
    font-weight: 800;
    color: #c2410c;
    text-align: center;
    min-height: 26px;
    text-shadow: 1px 1px 0 #fff;
    transition: opacity .2s;
  }
  button#restart {
    margin-bottom: 18px;
    padding: 10px 28px;
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(180deg, #ff6b6b, #d63031);
    border: none;
    border-radius: 13px;
    box-shadow: 0 6px 0 #c43d3d;
    cursor: pointer;
  }
  button#restart:active { transform: translateY(4px); box-shadow: none; }
  .hint { margin-top: 8px; color: #5a3a9a; font-size: 13px; text-align: center; opacity: .9; }
  @media (max-width: 560px) {
    h1 { font-size: 28px; }
    #hud { gap: 14px; font-size: 17px; }
    .stat { padding: 6px 12px; min-width: 85px; }
    .stat b { font-size: 20px; }
  }
</style>
</head>
<body>
<h1>FRUIT CRUSH</h1>
<div class="subtitle">Swap fruits to match 3 or more in a row!</div>
<div id="hud">
  <div class="stat"><span>Target</span><b id="target">10,000</b></div>
  <div class="stat"><span>Score</span><b id="score">0</b></div>
  <div class="stat"><span>Moves</span><b id="moves">25</b></div>
</div>
<div id="board-wrap">
  <canvas id="board" width="512" height="512"></canvas>
</div>
<div id="msg">Make a move!</div>
<button id="restart">Restart</button>
<p class="hint">Tap/click a fruit, then tap an adjacent fruit to swap.</p>
<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const movesEl = document.getElementById('moves');
const targetEl = document.getElementById('target');
const msgEl = document.getElementById('msg');
const restartBtn = document.getElementById('restart');

const COLS = 8;
const ROWS = 8;
const CELL = 64;
const TYPES = 6; // Apple, Banana, Orange, Grapes, Strawberry, Pineapple
const TARGET_SCORE = 3000;
const START_MOVES = 35;

// ---------- Game state ----------
let board = [];        // rows x cols of fruit type ints (null = empty)
let selected = null;   // {r, c}
let score = 0;
let moves = START_MOVES;
let combo = 0;
let processing = false;
let gameOver = false;
let won = false;

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return audioCtx;
}

function playTone(freq, type, duration, vol = 0.1) {
  const ctx = initAudio();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, ctx.currentTime);
  g.gain.setValueAtTime(vol, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + duration);
}

// Short swipe when swapping fruits
function playSwap() {
  const ctx = initAudio();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(150, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(700, ctx.currentTime + 0.1);
  g.gain.setValueAtTime(0.07, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + 0.1);
}

// Low buzz for invalid swaps
function playBuzz() {
  const ctx = initAudio();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(120, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.15);
  g.gain.setValueAtTime(0.08, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + 0.15);
}

// Pop when fruits are crushed
function playMatch(count) {
  const base = 350 + count * 70;
  playTone(base, 'square', 0.1, 0.12);
  setTimeout(() => playTone(base * 1.6, 'square', 0.1, 0.1), 50);
  if (count >= 4) {
    playSpecial(count);
  }
}

// Ascending chime for chain reactions / cascades
function playCascade(level) {
  playTone(450 + level * 130, 'sine', 0.2, 0.14);
}

// Special sound for big matches (4+)
function playSpecial(count) {
  playTone(700, 'triangle', 0.15, 0.14);
  setTimeout(() => playTone(1200, 'triangle', 0.25, 0.11), 120);
}

// Victory jingle
function playWin() {
  const notes = [523, 659, 784, 1047];
  notes.forEach((f, i) => {
    setTimeout(() => playTone(f, 'square', 0.3, 0.15), i * 130);
  });
}

// Sad descending sound for game over
function playGameOver() {
  const ctx = initAudio();
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(220, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.5);
  g.gain.setValueAtTime(0.1, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
  o.connect(g);
  g.connect(ctx.destination);
  o.start();
  o.stop(ctx.currentTime + 0.5);
}

// ---------- Board helpers ----------
function key(r, c) { return r + ',' + c; }
function parseKey(k) { const p = k.split(','); return { r: +p[0], c: +p[1] }; }

function randomType() { return Math.floor(Math.random() * TYPES); }

// Generate a board with no initial matches (row-major placement avoids 3-in-a-row)
function generateBoard() {
  let b = [];
  for (let r = 0; r < ROWS; r++) {
    b[r] = [];
    for (let c = 0; c < COLS; c++) {
      let tries = 0;
      let t;
      do {
        t = randomType();
        tries++;
      } while (tries < 60 &&
               ((c >= 2 && b[r][c - 1] === t && b[r][c - 2] === t) ||
                (r >= 2 && b[r - 1][c] === t && b[r - 2][c] === t)));
      b[r][c] = t;
    }
  }
  return b;
}

function hasAnyMove() {
  // try swapping right and down for every cell
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c + 1 < COLS) {
        swapCells(board, r, c, r, c + 1);
        if (findMatches().size > 0) { swapCells(board, r, c, r, c + 1); return true; }
        swapCells(board, r, c, r, c + 1);
      }
      if (r + 1 < ROWS) {
        swapCells(board, r, c, r + 1, c);
        if (findMatches().size > 0) { swapCells(board, r, c, r + 1, c); return true; }
        swapCells(board, r, c, r + 1, c);
      }
    }
  }
  return false;
}

function swapCells(b, r1, c1, r2, c2) {
  const tmp = b[r1][c1];
  b[r1][c1] = b[r2][c2];
  b[r2][c2] = tmp;
}

// Find all cells part of a horizontal or vertical match of length >= 3
function findMatches() {
  const matched = new Set();
  // horizontal
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      const t = board[r][c];
      if (t == null) { c++; continue; }
      let run = 1;
      while (c + run < COLS && board[r][c + run] === t) run++;
      if (run >= 3) {
        for (let k = 0; k < run; k++) matched.add(key(r, c + k));
      }
      c += run;
    }
  }
  // vertical
  for (let c = 0; c < COLS; c++) {
    let r = 0;
    while (r < ROWS) {
      const t = board[r][c];
      if (t == null) { r++; continue; }
      let run = 1;
      while (r + run < ROWS && board[r + run][c] === t) run++;
      if (run >= 3) {
        for (let k = 0; k < run; k++) matched.add(key(r + k, c));
      }
      r += run;
    }
  }
  return matched;
}

function clearMatches(matched) {
  let removed = 0;
  for (const k of matched) {
    const p = parseKey(k);
    board[p.r][p.c] = null;
    removed++;
  }
  return removed;
}

function gravityAndRefill() {
  // drop fruits down in each column
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (board[r][c] != null) {
        board[write][c] = board[r][c];
        write--;
      }
    }
    for (let r = write; r >= 0; r--) board[r][c] = null;
  }
  // spawn new fruits at the top
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (board[r][c] == null) board[r][c] = randomType();
    }
  }
}

function processChain(matched) {
  processing = true;
  let chain = 1;
  while (matched.size > 0) {
    const removed = clearMatches(matched);
    score += removed * 10 * chain;
    const cascade = chain > 1;
    chain++;
    playMatch(removed);
    if (cascade) playCascade(chain);
    gravityAndRefill();
    draw();
    matched = findMatches();
  }
  processing = false;
  combo = 0;
  checkEndGame();
}

function attemptSwap(r1, c1, r2, c2) {
  if (processing || gameOver) return;
  swapCells(board, r1, c1, r2, c2);
  const matched = findMatches();
  if (matched.size === 0) {
    // invalid swap: swap back
    swapCells(board, r1, c1, r2, c2);
    selected = null;
    draw();
    playBuzz();
    msgEl.textContent = 'No match! Try again.';
    setTimeout(() => { if (!gameOver) msgEl.textContent = 'Make a move!'; }, 1100);
    return;
  }
  // valid move
  moves--;
  selected = null;
  updateHUD();
  playSwap();
  processChain(matched);
}

function checkEndGame() {
  draw();
  if (score >= TARGET_SCORE) {
    won = true; gameOver = true;
    msgEl.textContent = 'You Win! 🎉 Target reached!';
    playWin();
    return;
  }
  if (moves <= 0) {
    gameOver = true;
    msgEl.textContent = 'Game Over! 💀 Out of moves.';
    playGameOver();
    return;
  }
  msgEl.textContent = 'Keep matching!';
}

function updateHUD() {
  scoreEl.textContent = score.toLocaleString();
  movesEl.textContent = moves;
  targetEl.textContent = TARGET_SCORE.toLocaleString();
}

function startGame() {
  do {
    board = generateBoard();
  } while (!hasAnyMove());
  score = 0;
  moves = START_MOVES;
  selected = null;
  processing = false;
  gameOver = false;
  won = false;
  combo = 0;
  updateHUD();
  msgEl.textContent = 'Make a move!';
  draw();
}

// ---------- Drawing ----------
const FRUIT_NAMES = ['Apple', 'Banana', 'Orange', 'Grapes', 'Strawberry', 'Pineapple'];

function drawFruit(type, cx, cy, s) {
  const k = s * 0.5; // half size
  ctx.save();
  ctx.translate(cx, cy);

  if (type === 0) { // Apple - red
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.arc(0, 0, k * 0.94, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(-k * 0.3, -k * 0.3, k * 0.32, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b4226'; // stem
    ctx.fillRect(-k * 0.11, -k * 1.02, k * 0.22, k * 0.32);
    ctx.fillStyle = '#27ae60'; // leaf
    ctx.beginPath(); ctx.arc(k * 0.36, -k * 0.9, k * 0.34, 0, Math.PI * 2); ctx.fill();
  } else if (type === 1) { // Banana - yellow crescent
    ctx.beginPath(); ctx.arc(0, 0, k * 0.96, -0.45, -2.75, true);
    ctx.lineWidth = k * 0.42; ctx.strokeStyle = '#ffeaa7'; ctx.lineCap = 'round'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, k * 0.96, -0.45, -2.75, true);
    ctx.lineWidth = k * 0.28; ctx.strokeStyle = '#f1c40f'; ctx.lineCap = 'round'; ctx.stroke();
    ctx.fillStyle = '#7d6608';
    ctx.fillRect(-k * 0.82, -k * 1.0, k * 0.16, k * 0.24); // stem
    ctx.beginPath(); ctx.arc(-k * 0.82, k * 0.92, k * 0.16, 0, Math.PI * 2); ctx.fill(); // tip
  } else if (type === 2) { // Orange - orange circle
    ctx.fillStyle = '#f39c12';
    ctx.beginPath(); ctx.arc(0, 0, k * 0.94, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath(); ctx.arc(-k * 0.3, -k * 0.3, k * 0.26, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#d68910'; ctx.lineWidth = k * 0.1;
    ctx.beginPath(); ctx.moveTo(0, -k * 0.94); ctx.lineTo(0, k * 0.94);
    ctx.moveTo(-k * 0.94, 0); ctx.lineTo(k * 0.94, 0);
    ctx.stroke();
    ctx.fillStyle = '#d68910';
    ctx.beginPath(); ctx.arc(0, k * 0.14, k * 0.2, 0, Math.PI * 2); ctx.fill();
  } else if (type === 3) { // Grapes - purple cluster
    ctx.fillStyle = '#27ae60'; // stem
    ctx.fillRect(-k * 0.11, -k * 0.98, k * 0.22, k * 0.3);
    ctx.fillStyle = '#8e44ad';
    const grapes = [
      [-k * 0.34, k * 0.14], [k * 0.34, k * 0.14],
      [-k * 0.12, k * 0.42], [k * 0.12, k * 0.42],
      [0, k * 0.24], [0, -k * 0.16],
      [-k * 0.24, k * -0.06], [k * 0.24, k * -0.06]
    ];
    for (const g of grapes) {
      ctx.beginPath(); ctx.arc(g[0], g[1], k * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5b2c6f'; ctx.lineWidth = k * 0.07; ctx.stroke();
    }
  } else if (type === 4) { // Strawberry - red
    ctx.fillStyle = '#ff4757';
    ctx.beginPath(); ctx.ellipse(0, k * 0.08, k * 0.8, k * 1.0, 0, 0, Math.PI * 2); ctx.fill();
    // seeds
    ctx.fillStyle = '#f9e79f';
    const seeds = [
      [-k * 0.4, k * 0.25], [k * 0.4, k * 0.25],
      [-k * 0.2, k * 0.6], [k * 0.2, k * 0.6],
      [-k * 0.35, k * -0.25], [k * 0.35, k * -0.25],
      [0, k * 0.05]
    ];
    for (const s2 of seeds) {
      ctx.beginPath(); ctx.arc(s2[0], s2[1], k * 0.07, 0, Math.PI * 2); ctx.fill();
    }
    // calyx (green top)
    ctx.fillStyle = '#27ae60';
    ctx.beginPath(); ctx.arc(-k * 0.4, -k * 0.72, k * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(k * 0.4, -k * 0.72, k * 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -k * 0.88, k * 0.34, 0, Math.PI * 2); ctx.fill();
  } else { // Pineapple - yellow with crosshatch + leaves
    ctx.save(); ctx.scale(1, 0.66);
    ctx.fillStyle = '#f4d03f';
    ctx.beginPath(); ctx.arc(0, 0, k * 0.88, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    // crosshatch texture
    ctx.strokeStyle = '#d4ac0d'; ctx.lineWidth = k * 0.08;
    for (let i = -1; i <= 1; i++) {
      const off = i * k * 0.35;
      ctx.beginPath(); ctx.moveTo(-k * 0.8 + off, -k * 0.8); ctx.lineTo(k * 0.8 + off, k * 0.8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(k * 0.8 + off, -k * 0.8); ctx.lineTo(-k * 0.8 + off, k * 0.8); ctx.stroke();
    }
    // leaves
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath(); ctx.arc(-k * 0.42, -k * 0.78, k * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(k * 0.42, -k * 0.78, k * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -k * 0.98, k * 0.32, 0, Math.PI * 2); ctx.fill();
  }

  ctx.restore();
}

function drawCellBg(r, c) {
  const x = c * CELL + 2, y = r * CELL + 2, sz = CELL - 4;
  ctx.fillStyle = 'rgba(255, 255, 255, 0.55)';
  ctx.fillRect(x, y, sz, sz);
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  ctx.strokeRect(x, y, sz, sz);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // cell backgrounds
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      drawCellBg(r, c);
    }
  }

  const fruitSize = CELL * 0.76;
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const t = board[r][c];
      if (t == null) continue;
      const cx = c * CELL + CELL / 2;
      const cy = r * CELL + CELL / 2;
      if (selected && selected.r === r && selected.c === c) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(1.08, 1.08);
        ctx.translate(-cx, -cy);
        drawFruit(t, cx, cy, fruitSize);
        ctx.restore();
      } else {
        drawFruit(t, cx, cy, fruitSize);
      }
    }
  }

  // selection highlight
  if (selected) {
    const x = selected.c * CELL + 4;
    const y = selected.r * CELL + 4;
    const sz = CELL - 8;
    ctx.save();
    ctx.shadowColor = 'rgba(255, 255, 255, 0.95)';
    ctx.shadowBlur = 16;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 5;
    ctx.strokeRect(x, y, sz, sz);
    ctx.restore();
  }
}

// ---------- Input ----------
function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function handlePointer(e) {
  if (processing || gameOver) return;
  const pos = getPos(e);
  const c = Math.floor(pos.x / CELL);
  const r = Math.floor(pos.y / CELL);
  if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;

  if (!selected) {
    selected = { r, c };
    draw();
    return;
  }
  if (selected.r === r && selected.c === c) {
    selected = null;
    draw();
    return;
  }
  const dr = Math.abs(r - selected.r);
  const dc = Math.abs(c - selected.c);
  if (dr + dc === 1) {
    attemptSwap(selected.r, selected.c, r, c);
  } else {
    selected = { r, c };
  }
  draw();
}

canvas.addEventListener('mousedown', handlePointer);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handlePointer(e); }, { passive: false });

restartBtn.addEventListener('click', startGame);

// ---------- Kick off ----------
startGame();
</script>
</body>
</html>
